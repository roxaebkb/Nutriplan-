<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriPlan — 30-Day African Meal Plans</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>🍲 NutriPlan</h1>
    <p>30-Day African Meal & Diet Plans</p>
  </header>

  <!-- Plan Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-plan="general">General</button>
    <button class="tab-btn" data-plan="diabetes">Diabetes</button>
    <button class="tab-btn" data-plan="heart">Heart Healthy</button>
    <button class="tab-btn" data-plan="weight-loss">Weight Loss</button>
    <button class="tab-btn" data-plan="weight-gain">Weight Gain</button>
    <button class="tab-btn" data-plan="muscle">Muscle Building</button>
  </nav>

  <!-- Day Selector -->
  <section class="day-selector">
    <button id="prevDay">&lt;</button>
    <span>Day <strong id="currentDay">1</strong> of 30</span>
    <button id="nextDay">&gt;</button>
  </section>

  <!-- Progress Bar -->
  <div class="progress-bar">
    <div id="progressFill"></div>
  </div>

  <!-- Meals Display -->
  <main id="mealsContainer">
    <!-- Injected by JavaScript -->
  </main>

  <!-- Footer -->
  <footer>
    <p>Authentic African recipes • No repetition (max 2 repeats) • 30 days per plan</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
