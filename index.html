    .tab-btn { padding: 0.6rem 1rem; border: none; border-radius: 2rem; background: var(--card); color: var(--muted); border: 1px solid var(--border); cursor: pointer; font-size: 0.88rem; transition: all 0.25s ease; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 2px 6px var(--shadow); }
    .tab-btn:hover:not(.active) { background: var(--accent-light); }
    .day-selector { display: flex; align-items: center; justify-content: center; gap: 1.2rem; padding: 1rem; font-size: 1.05rem; font-weight: 500; }
    .day-selector button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .day-selector button:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .progress-bar { width: 92%; max-width: 420px; margin: 0 auto 1.2rem; height: 10px; background: var(--accent-light); border-radius: 5px; overflow: hidden; }
    #progressFill { height: 100%; width: 3.33%; background: var(--accent); border-radius: 5px; transition: width 0.3s ease; }
    #mealsContainer { max-width: 480px; margin: 0 auto; padding: 0 1rem; }
    .meal-card { background: var(--card); border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 4px 10px var(--shadow); border: 1px solid var(--border); }
    .meal-card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: var(--accent); display: flex; align-items: center; gap: 0.4rem; }
    .meal-card p { font-size: 0.98rem; color: var(--text); line-height: 1.5; }
    .meal-card.breakfast h3::before { content: "🌅"; }
    .meal-card.lunch h3::before { content: "☀️"; }
    .meal-card.dinner h3::before { content: "🌙"; }
    footer { text-align: center; margin-top: 2rem; padding: 1rem; font-size: 0.85rem; color: var(--muted); }
